# The Site Configuration
# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: en

# Change to your timezone
timezone: Europe/London

# jekyll-seo-tag settings
title: Waken Dev
tagline: Backend Engineer | Distributed Systems | AI Infrastructure
description: >-
  Tech blog by Waken Meng — backend engineering, distributed systems,
  Go, Rust, and building things at scale.

# Fill in the protocol & hostname for your site.
url: "https://www.waken.dev"
baseurl: ""

github:
  username: wakenmeng

twitter:
  username: wakenmeng

social:
  name: Waken Meng
  links:
    - https://github.com/wakenmeng
    - https://twitter.com/wakenmeng

# Site Verification Settings
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Web Analytics Settings
analytics:
  google:
    id: G-E905MG21HD
  goatcounter:
    id:

# Prefer color scheme setting.
# Leave empty will follow the system prefer color scheme.
# Available options: light, dark
theme_mode:

# The CDN endpoint for media resources.
# Notice that once it is assigned, the CDN url
# will be added to all media resources (site avatar, posts' images, etc.)
cdn:

# the avatar on sidebar, support local or CORS resources
avatar: /assets/logo.png

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
social_preview_image:

# boolean type, the global switch for TOC in posts.
toc: true

comments:
  provider:

# Self-hosted static assets, optional
assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: false

paginate: 10

# The base URL of your site
# If you're using a custom domain, make sure to add it to the `url` field

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _tabs
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
